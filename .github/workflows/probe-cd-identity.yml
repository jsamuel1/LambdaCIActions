# THROWAWAY probe: exercise the ADR-047 OIDC identity path end-to-end on our own microVM
# runner WITHOUT mutating the shared dev environment. Deleted before this branch merges.
#
# What it proves: id-token -> AssumeRoleWithWebIdentity against lca-dev-github-deploy ->
# sts:AssumeRole on each CDK bootstrap role -> cloudformation:DescribeStacks on the two
# CD-deployed stacks -> `cdk deploy` reaches CloudFormation under the deploy role. It also
# proves the NEGATIVE: the role cannot read the control/image/data stacks.
name: Probe CD identity (read-only)
on:
  push:
    branches: [kermes/task-rainy-platypus]
permissions:
  id-token: write
  contents: read
env:
  LCA_DEPLOY_ACCOUNT: '863638663908'
  LCA_DEPLOY_REGION: us-west-2
  LCA_DEPLOY_ENV: dev
  AWS_REGION: us-west-2
jobs:
  probe:
    runs-on: [self-hosted, lambda-ci-node]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run build:web

      - name: Assume deploy role (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::863638663908:role/lca-dev-github-deploy
          aws-region: us-west-2
          role-session-name: lca-cd-probe-${{ github.run_id }}

      - name: Identity matches the pin
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          acct=$(aws sts get-caller-identity --query Account --output text)
          [ "$acct" = "$LCA_DEPLOY_ACCOUNT" ] || { echo "::error::$acct != $LCA_DEPLOY_ACCOUNT"; exit 1; }

      - name: Can assume all four bootstrap roles
        run: |
          set -euo pipefail
          for kind in deploy file-publishing image-publishing lookup; do
            arn="arn:aws:iam::863638663908:role/cdk-hnb659fds-${kind}-role-863638663908-us-west-2"
            aws sts assume-role --role-arn "$arn" --role-session-name probe \
              --query 'AssumedRoleUser.Arn' --output text
          done

      - name: Can read the two allowlisted stacks
        run: |
          set -euo pipefail
          for s in LCA-Mgmt-dev LCA-Web-dev; do
            aws cloudformation describe-stacks --stack-name "$s" \
              --query 'Stacks[0].[StackName,StackStatus,LastUpdatedTime]' --output text
          done

      - name: NEGATIVE — cannot read the control plane
        run: |
          set -euo pipefail
          for s in LCA-Control-dev LCA-Image-dev LCA-Data-dev LCA-Deploy-dev; do
            if aws cloudformation describe-stacks --stack-name "$s" >/dev/null 2>&1; then
              echo "::error::deploy role can read $s — allowlist is not enforced by IAM"
              exit 1
            fi
            echo "denied as expected: $s"
          done

      # Reaches CloudFormation under the deploy role but changes nothing. This is the step that
      # proves `cdk deploy` would work: same credential chain, same bootstrap-role assumption,
      # same asset publish, stopping short of executing a change set.
      - name: cdk diff under the deploy role (no mutation)
        run: |
          set -euo pipefail
          npx cdk diff LCA-Web-dev --exclusively -c env=dev 2>&1 | tail -40

      - name: Summary
        if: always()
        run: |
          {
            echo "## CD identity probe (read-only)"
            echo "- OIDC assume: OK"
            echo "- bootstrap roles assumable: deploy, file-publishing, image-publishing, lookup"
            echo "- DescribeStacks allowed: LCA-Mgmt-dev, LCA-Web-dev"
            echo "- DescribeStacks denied: LCA-Control-dev, LCA-Image-dev, LCA-Data-dev, LCA-Deploy-dev"
            echo "- runner: self-hosted microVM (lambda-ci-node)"
          } >> "$GITHUB_STEP_SUMMARY"
