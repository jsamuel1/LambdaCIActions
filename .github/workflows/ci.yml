name: CI

# Self-hosted dogfooding (ROADMAP M1+): every job in this repo runs on our own
# LambdaCIActions microVM runners via spec 03 label mode:
#
#   runs-on: [self-hosted, lambda-ci]           # base flavor
#   runs-on: [self-hosted, lambda-ci-node]      # node flavor
#   runs-on: [self-hosted, lambda-ci-docker]    # docker flavor
#
# This repo is the first consumer of its own CI — no GitHub-hosted runners, so CI
# is unaffected by GitHub Actions minutes/billing. If the platform is down, jobs
# queue rather than falling back (deliberate: a silent fallback would hide outages).
# See docs/specs/03-workflow-ingestion.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, lambda-ci-node]   # dogfood: node flavor microVM
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint (if configured)
        run: |
          if npm run | grep -q '^  lint'; then npm run lint; else echo "no lint script — skipping"; fi

      - name: Build
        run: npm run build

      # Console SPA (M4): esbuild bundle. Must build before synth so WebStack's asset
      # deployment is exercised rather than silently skipped.
      - name: Build console SPA
        run: npm run build:web

      - name: Test
        run: npm test

      # Guard: `cdk synth` must work WITHOUT a deploy-target pin (ADR-018) — the
      # credential-less CI path stays exempt so the build gate never needs an account.
      - name: Synth (no .env.local — ADR-018 CI exemption)
        run: npx cdk synth -q

      # Always-on smoke test: the bootstrap script must parse + render its manifest.
      - name: Smoke-test GitHub App manifest generator
        run: node scripts/create-github-app.mjs --dry-run --env ci

  docs-check:
    runs-on: [self-hosted, lambda-ci]   # dogfood: base flavor microVM
    steps:
      - uses: actions/checkout@v4
      - name: Ensure design docs exist
        run: |
          set -e
          for f in README.md AGENTS.md docs/ARCHITECTURE.md docs/DECISIONS.md docs/ROADMAP.md \
                   docs/specs/01-github-app.md docs/specs/02-microvm-runners.md \
                   docs/specs/03-workflow-ingestion.md docs/specs/04-web-ui.md \
                   docs/specs/05-infrastructure.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          echo "all design docs present"
